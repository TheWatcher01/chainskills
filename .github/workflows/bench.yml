name: Monthly Benchmark

on:
  schedule:
    - cron: '0 0 1 * *'  # 1st of each month
  workflow_dispatch:
    inputs:
      models:
        description: 'Comma-separated model list'
        default: 'claude-sonnet-4-6,gpt-4o-mini'
      provider:
        description: 'Agent provider'
        default: 'anthropic'

jobs:
  benchmark:
    name: Run Benchmark Suite
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build CLI
        run: pnpm --filter chainskills build

      - name: Run benchmark suite
        run: |
          node cli-mcp-core/dist/cli/index.mjs bench-suite \
            --suite cli-mcp-core/benchmarks \
            --models "${{ github.event.inputs.models || 'claude-sonnet-4-6,gpt-4o-mini' }}" \
            --output bench-results/ \
            --json > bench-results/summary.json
        env:
          AGENT_PROVIDER: ${{ github.event.inputs.provider || 'anthropic' }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

      - name: Generate leaderboard
        run: |
          node cli-mcp-core/dist/cli/index.mjs leaderboard \
            --input bench-results/ \
            --output site/

      - name: Export HuggingFace dataset
        run: |
          node cli-mcp-core/dist/cli/index.mjs export-hf \
            --input bench-results/ \
            --output dataset/

      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: bench-results-${{ github.run_number }}
          path: |
            bench-results/
            site/
            dataset/

      - name: Deploy leaderboard to GitHub Pages
        if: github.ref == 'refs/heads/main'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site
